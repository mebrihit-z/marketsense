<div >
  <app-header
    [showTopDisclaimerBanner]="showDisclaimerBanner && !isDisclaimerBannerAtBottom"
    (learnMoreClicked)="openDisclosureModal()"
    (dismissDisclaimer)="dismissDisclaimerBanner()">
  </app-header>
  <div class="dashboard-container" 
      [class.asset-allocation-pinned]="isAssetAllocationPinned"
      [class.asset-flows-pinned]="isAssetFlowsPinned">
    <div class="dashboard-top-content">
      <!-- Welcome Section -->
      <app-welcome-section></app-welcome-section>

      <!-- Ask MarketSense AI Section -->
      <app-ask-marketsense-section></app-ask-marketsense-section>
    </div>

    <!-- Direct child of .dashboard-container so position:sticky works; margin cancels row-gap so cream does not show -->
    <div class="dashboard-filters-sticky" #filtersSticky>
      <app-filters-bar
        [forceCloseDropdown]="forceCloseFiltersDropdown"
        [stickyEngaged]="isFiltersStickyEngaged"
        [assetFlowsChartDimensions]="assetFlowsChartDimensions"
        [assetAllocationChartDimensions]="assetAllocationChartDimensions"
        (dataTypeChange)="onDataTypeChange($event)"
        (timeHorizonChange)="onTimeHorizonChange($event)"
        (timeHorizonRangeChange)="onTimeHorizonRangeChange($event)"
        (productSubTypeChange)="onProductSubTypeChange($event)"
        (productTypeChange)="onProductTypeChange($event)"
        (productRegionChange)="onProductRegionChange($event)"
        (investorRegionChange)="onInvestorRegionChange($event)"
        (investorTypeChange)="onInvestorTypeChange($event)"
        (filterOptionTotalsChange)="onFilterOptionTotalsChange($event)"
        (filterDropdownOpened)="onFilterDropdownOpened()"
        (minFlowValueRangeChange)="onMinFlowValueRangeChange($event)">
      </app-filters-bar>
    </div>

    <!-- Featured Market Flows Carousel -->
    <div class="carousel-section">
      <app-featured-market-flows-carousel 
        [cards]="filteredMarketFlowCards"
        [pinnedCardIds]="pinnedCardIds"
        [dataType]="carouselDataType"
        [selectedTimeHorizon]="carouselTimeHorizon"
        [rawAssetFlowsData]="filterBarScopedAssetFlowsData"
        [timeHorizonRange]="timeHorizonRange"
        [selectedInvestorRegions]="selectedInvestorRegions"
        [selectedInvestorTypes]="selectedInvestorTypes"
        [selectedProductRegions]="selectedProductRegions"
        [selectedProductTypes]="selectedProductTypes"
        (pinCard)="onPinCard($event)">
      </app-featured-market-flows-carousel>
    </div>
    
    <!-- Line Chart Card -->
    <!-- <div class="line-chart-section">
      <app-line-chart-card></app-line-chart-card>
    </div> -->
    
    <!-- Asset Flows Section -->
    <div class="asset-flows-section" [class.pinned]="isAssetFlowsPinned">
      <app-asset-flows 
        [selectedProductTypes]="selectedProductTypes"
        [selectedProductSubTypes]="selectedProductSubTypes"
        [selectedInvestorRegions]="selectedInvestorRegions"
        [selectedInvestorTypes]="selectedInvestorTypes"
        [selectedProductRegions]="selectedProductRegions"
        [totalProductTypes]="filterOptionTotals.productTypeTotal"
        [totalProductSubTypes]="filterOptionTotals.productSubTypeTotal"
        [totalInvestorRegions]="filterOptionTotals.investorRegionTotal"
        [totalInvestorTypes]="filterOptionTotals.investorTypeTotal"
        [totalProductRegions]="filterOptionTotals.productRegionTotal"
        [dataType]="carouselDataType"
        [timeHorizon]="carouselTimeHorizon"
        [timeHorizonStart]="timeHorizonRange?.start"
        [timeHorizonEnd]="timeHorizonRange?.end"
        [minFlowValue]="chartMinFlowLower"
        [maxFlowValue]="chartMaxFlowUpper"
        [forceCloseDimensionDropdown]="forceCloseDimensionDropdown"
        (pinToggle)="onAssetFlowsPinToggle()"
        (dimensionDropdownOpened)="onDimensionDropdownOpened()"
        (chartDimensionsSnapshot)="onAssetFlowsChartDimensionsSnapshot($event)">
      </app-asset-flows>
    </div>
    <!-- Asset Allocation Section -->
    <div class="asset-allocation-section" [class.pinned]="isAssetAllocationPinned">
      <app-asset-allocation 
        [selectedProductTypes]="selectedProductTypes"
        [selectedProductRegions]="selectedProductRegions"
        [selectedProductSubTypes]="selectedProductSubTypes"
        [selectedInvestorRegions]="selectedInvestorRegions"
        [selectedInvestorTypes]="selectedInvestorTypes"
        [totalProductTypes]="filterOptionTotals.productTypeTotal"
        [totalProductSubTypes]="filterOptionTotals.productSubTypeTotal"
        [totalInvestorRegions]="filterOptionTotals.investorRegionTotal"
        [totalInvestorTypes]="filterOptionTotals.investorTypeTotal"
        [totalProductRegions]="filterOptionTotals.productRegionTotal"
        [dataType]="carouselDataType"
        [timeHorizon]="carouselTimeHorizon"
        [timeHorizonStart]="timeHorizonRange?.start"
        [timeHorizonEnd]="timeHorizonRange?.end"
        [minFlowValue]="chartMinFlowLower"
        [maxFlowValue]="chartMaxFlowUpper"
        [forceCloseDimensionDropdown]="forceCloseDimensionDropdown"
        (pinToggle)="onAssetAllocationPinToggle()"
        (dimensionDropdownOpened)="onDimensionDropdownOpened()"
        (chartDimensionsSnapshot)="onAssetAllocationChartDimensionsSnapshot($event)">
      </app-asset-allocation>
    </div>
  </div>

  <!-- Sticky Ask MarketSense AI button (fixed bottom-right when scrolling) -->
  <app-ask-marketsense-sticky-button></app-ask-marketsense-sticky-button>

  <app-disclaimer-banner
    [isVisible]="showDisclaimerBanner && isDisclaimerBannerAtBottom"
    position="bottom"
    (learnMore)="openDisclosureModal()"
    (close)="dismissDisclaimerBanner()">
  </app-disclaimer-banner>

  <app-disclosure-modal
    [isVisible]="isDisclosureModalOpen"
    (close)="closeDisclosureModal()"
    (acknowledge)="onDisclosureAcknowledged()">
  </app-disclosure-modal>
</div>
