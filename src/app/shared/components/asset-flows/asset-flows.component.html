<div class="asset-flows-container">
  <div class="top-section">
  <!-- Header Section -->
    <div class="header-section">
      <!-- Left: Title and Button -->
      <div class="title-container">
        <div class="title-row">
          <app-title title="Asset Flows" subtitle="Aggregated asset flows across selected categories" level="h2"></app-title>
        </div>
      </div>

      <!-- Right: Controls -->
      <div class="controls-section">
        <!-- Pin Button -->
        <button class="more-options-btn" [class.pinned]="isPinned" aria-label="Pin Button" (click)="onPinClick()">
          <img [src]="isPinned ? 'assets/icons/pined-pin-icon.svg' : 'assets/icons/pin-icon.svg'" alt="Pin Button">
        </button>
        <!-- Download Button -->
        <button class="more-options-btn" aria-label="Export Sankey chart" (click)="onOpenExportModal()">
          <img src="assets/icons/download-icon.svg" alt="More options">
        </button>
      </div>
    </div>

    <!-- Flow Dimensions & Min Flow Section -->
    <div class="dimensions-section">
      <div class="dimensions-section-inner">
        <app-flow-dimensions
          title="Flow Dimensions"
          subtitle="Select three dimensions to organize asset flows in sankey diagram below. Each dimension controls a matching pair of nodes on the left (outflow) and right (inflow) sides of the diagram."
          [availableDimensions]="availableDimensions"
          [selectedDimension1]="selectedDimension1"
          [selectedDimension2]="selectedDimension2"
          [selectedDimension3]="selectedDimension3"
          [forceCloseDimensionDropdown]="forceCloseDimensionDropdown"
          [showNoneForDimension3]="true"
          (dimensionChange)="onFlowDimensionChange($event)"
          (dimensionDropdownOpened)="dimensionDropdownOpened.emit()">
        </app-flow-dimensions>
      </div>
      <ng-container *ngIf="minFlowValueOptions.length">
        <div class="dimension-selector-container min-flow-value-container">
          <span class="dimension-number-label">Min flow value:</span>
          <app-min-flow-range-slider
            class="min-flow-range-embed"
            [options]="minFlowValueOptions"
            [(range)]="minFlowRange" />
        </div>
      </ng-container>
    </div>
  </div>
  <!-- Regional Sankey Diagram Visualization -->
  <div class="visualization-container" #chartExportRoot>
    <div *ngFor="let regionData of regionDataArray; let isLast = last; trackBy: trackByRegionKey" class="sankey-region-container">
      <app-sankey
        [data]="regionData.data"
        [regionKey]="regionData.key"
        [selectedInvestorRegions]="regionData.investorRegions"
        [selectedProductTypes]="cachedSelectedProductTypes"
        [selectedProductSubTypes]="cachedSelectedProductSubTypes"
        [minFlowValue]="chartMinFlowLower"
        [maxFlowValue]="chartMaxFlowUpper"
        [dimension1Label]="selectedDimension1?.label"
        [dimension2Label]="selectedDimension2?.label"
        [timeHorizon]="timeHorizon"
        [timeHorizonStart]="timeHorizonStart"
        [timeHorizonEnd]="timeHorizonEnd"
        [showLegend]="true">
      </app-sankey>
    </div>
  </div>
</div>

<app-charts-export-modal
  [isVisible]="showExportModal"
  [title]="'Export Asset Flows'"
  [subtitle]="'PNG or PDF snapshot of the Sankey view'"
  (close)="onCloseExportModal()"
  (exportPNG)="onExportPNG()"
  (exportPDF)="onExportPDF()">
</app-charts-export-modal>
