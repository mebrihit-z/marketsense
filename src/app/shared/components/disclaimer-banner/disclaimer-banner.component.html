<div
  class="disclaimer-banner"
  [class.disclaimer-banner--bottom]="position === 'bottom'"
  *ngIf="isVisible">
  <div class="disclaimer-banner__content">
    <svg
      class="disclaimer-banner__icon"
      xmlns="http://www.w3.org/2000/svg"
      width="14"
      height="14"
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true">
      <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
      <path d="M12 7.8V12.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="12" cy="15.8" r="1.1" fill="currentColor"/>
    </svg>
    <p class="disclaimer-banner__text">
      Insights are generated from predictive models, Mercer client data, and external market indicators. Outputs are directional and should not be treated as guaranteed forecasts.
      <a href="#" class="disclaimer-banner__link" (click)="onLearnMore($event)">Learn More</a>
    </p>
  </div>
  <button
    type="button"
    class="disclaimer-banner__close"
    aria-label="Dismiss disclaimer"
    (click)="onClose()">
    <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 10 10" fill="none">
      <path d="M0.933333 9.33333L0 8.4L3.73333 4.66667L0 0.933333L0.933333 0L4.66667 3.73333L8.4 0L9.33333 0.933333L5.6 4.66667L9.33333 8.4L8.4 9.33333L4.66667 5.6L0.933333 9.33333Z" fill="#00113F"/>
    </svg>
  </button>
</div>
