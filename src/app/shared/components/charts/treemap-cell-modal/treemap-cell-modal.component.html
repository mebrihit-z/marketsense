<div class="modal-overlay" (click)="onClose()" *ngIf="isVisible">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <!-- Title -->
      <div class="title-section">
        <app-title [title]="getTitle()" level="h3" class="modal-title"></app-title>
      </div>

      <!-- Key Metrics Section -->
      <div class="metrics-section" *ngIf="cellData">
        <!-- Projected Value -->
        <div class="metric-row">
          <span class="metric-label">Projected Value</span>
          <span class="metric-value">{{ getFormattedValue() }}</span>
        </div>

        <!-- Expected Change -->
        <div class="metric-row">
          <span class="metric-label">Expected Change</span>
          <span class="metric-value">{{ getFormattedPercentage() }} ({{ getFlowTypeLabel() }})</span>
        </div>
      </div>

      <!-- AI Confidence Indicator -->
      <div class="ai-confidence-section">
        <div class="confidence-indicator"></div>
        <span class="confidence-label">AI Confidence</span>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Description -->
      <div class="description-section">
        <p class="description-text">{{ getDescription() }}</p>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- Ask AI Button -->
      <button class="ask-ai-button" type="button" (click)="onAskAI($event)">
        <img src="assets/icons/sparkle-icon.svg" alt="Sparkle" class="ask-ai-icon">
        <span class="ask-ai-text">Ask MarketSense AI for more insights</span>
      </button>
    </div>
  </div>
</div>

<!-- Ask MarketSense Modal -->
<app-ask-marketsense-modal
  [isVisible]="showAskMarketSenseModal"
  [card]="getMarketFlowCard()"
  (close)="onCloseAskMarketSenseModal()"
  (sendMessage)="onSendMessage($event)">
</app-ask-marketsense-modal>
