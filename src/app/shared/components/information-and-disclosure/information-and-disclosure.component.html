<div
  class="iad-backdrop"
  *ngIf="isVisible"
  (click)="onClose()">

    class="iad-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="iad-dialog-title"
    (click)="$event.stopPropagation()">

      <div class="iad-header__lead">

          </svg>
        </div>
        <h2 id="iad-dialog-title" class="iad-header__title">{{ dialogTitle }}</h2>
      </div>
      <button type="button" class="iad-header__close" aria-label="Close disclosure" (click)="onClose()">
        &times;
      </button>
    </header>

    <div class="iad-body">
      <div class="iad-tabs" role="tablist" aria-label="Disclosure sections">
        <button
          type="button"
          role="tab"
          class="iad-tab"
          [class.iad-tab--active]="activeTab === 'about'"
          [attr.aria-selected]="activeTab === 'about'"
          id="iad-tab-about"
          aria-controls="iad-panel-about"
          (click)="setTab('about')">
          {{ aboutTabLabel }}
        </button>
        <button
          type="button"
          role="tab"
          class="iad-tab"
          [class.iad-tab--active]="activeTab === 'legal'"
          [attr.aria-selected]="activeTab === 'legal'"
          id="iad-tab-legal"
          aria-controls="iad-panel-legal"
          (click)="setTab('legal')">
          Legal &amp; Data Information
        </button>
      </div>

      <div

        id="iad-panel-about"
        role="tabpanel"
        aria-labelledby="iad-tab-about"
        class="iad-panels">
