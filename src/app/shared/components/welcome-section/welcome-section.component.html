<div class="welcome-section">
  <div class="welcome-content">
    <!-- Left: Welcome + Last login -->
    <div class="welcome-left">
      <div class="welcome-title-wrapper">
        <h2 class="welcome-title">
          <span class="welcome-greeting">Welcome back,</span>
          <span class="welcome-name">{{ displayName }}</span>
        </h2>
      </div>
      <div class="welcome-meta">
        <img src="assets/icons/clock-icon.svg" alt="" class="clock-icon" />
        <span class="last-login">Last login: {{ displayLastLogin }}</span>
      </div>
    </div>

    <!-- Right: Saved Views button -->
    <div class="saved-views-wrap">
      <div class="viewing-filter-container" [class.open]="isViewingDropdownOpen">
        <button
          #filterButton
          type="button"
          class="saved-views-btn"
          (click)="toggleViewingDropdown()"
          [disabled]="savedViewsCount === 0"
          [attr.aria-expanded]="savedViewsCount > 0 && isViewingDropdownOpen"
          [attr.aria-haspopup]="savedViewsCount > 0 ? 'menu' : null">
          <img src="assets/icons/bookmark-icon.svg" alt="Saved" class="bookmark-icon">
          <span class="saved-views-text">{{ savedViewsCount }} Saved Views</span>
          <img src="assets/icons/caret-down-icon.svg" alt="Dropdown" class="caret-icon">
        </button>
        <div
          class="viewing-dropdown"
          *ngIf="isViewingDropdownOpen && savedViewsCount > 0"
          [style.top.px]="dropdownPosition.top"
          [style.left.px]="dropdownPosition.left">
         
          <div class="viewing-dropdown-content">
            <div
              *ngFor="let option of viewingOptions"
              class="dropdown-option-card"
              [class.active]="option.isActive">
              <div class="option-content">
                <!-- Only this region applies the preset; default is changed only via the checkbox below. -->
                <div class="option-apply-zone" (click)="selectViewingOption(option)">
                  <div class="option-top-row">
                    <div class="option-header">
                      <div class="option-header-left">
                        <app-title [title]="option.name" level="h5" class="option-title"></app-title>
                        <span class="default-badge" *ngIf="option.isDefault">Default</span>
                        <span class="active-badge" *ngIf="option.isActive">Active</span>
                      </div>
                    </div>
                    <button
                      type="button"
                      class="delete-btn"
                      (click)="deleteOption(option, $event)"
                      aria-label="Delete preset">
                      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M16.2222 5.2V16.4C16.2222 16.8243 16.0349 17.2313 15.7015 17.5314C15.3681 17.8314 14.9159 18 14.4444 18H5.55556C5.08406 18 4.63187 17.8314 4.29848 17.5314C3.96508 17.2313 3.77778 16.8243 3.77778 16.4V5.2M2 5.2H18M6.44444 5.2V3.6C6.44444 3.17565 6.63175 2.76869 6.96514 2.46863C7.29854 2.16857 7.75073 2 8.22222 2H11.7778C12.2493 2 12.7015 2.16857 13.0349 2.46863C13.3683 2.76869 13.5556 3.17565 13.5556 3.6V5.2" stroke="#BE2E2C" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
                      </svg>
                    </button>
                  </div>
                  <p class="option-saved-date">Saved {{ option.savedDate }}</p>
                  <div class="option-tags">
                    <span class="option-tag" *ngFor="let tag of option.tags">{{ tag }}</span>
                  </div>
                </div>
                <div class="option-set-default">
                  <input
                    type="checkbox"
                    [id]="defaultCheckboxId(option)"
                    [checked]="option.isDefault"
                    (change)="toggleDefaultForOption(option, $event)"
                    [attr.aria-labelledby]="defaultCheckboxLabelId(option)" />
                  <label
                    [for]="defaultCheckboxId(option)"
                    [id]="defaultCheckboxLabelId(option)"
                    class="option-set-default-label">
                    Set as default
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Remove saved view confirmation -->
  <div
    class="saved-view-delete-backdrop"
    *ngIf="pendingDeleteOption"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="saved-view-delete-title"
    aria-describedby="saved-view-delete-desc"
    (click)="cancelDeleteSavedView()">
    <div class="saved-view-delete-dialog" (click)="$event.stopPropagation()">
      <h3 id="saved-view-delete-title" class="saved-view-delete-title">Remove saved view?</h3>
      <p id="saved-view-delete-desc" class="saved-view-delete-desc">
        This will remove
        <strong>{{ pendingDeleteOption.name }}</strong>
        from your saved views. You can save the current filters again anytime, but this preset will be gone.
      </p>
      <div class="saved-view-delete-actions">
        <button type="button" class="saved-view-delete-btn saved-view-delete-btn--cancel" (click)="cancelDeleteSavedView()">
          Cancel
        </button>
        <button type="button" class="saved-view-delete-btn saved-view-delete-btn--remove" (click)="confirmDeleteSavedView()">
          Remove
        </button>
      </div>
    </div>
  </div>

  <!-- Ask MarketSense Modal -->
  <app-ask-marketsense-modal
    [isVisible]="showAskMarketSenseModal"
    [card]="null"
    (close)="onCloseModal()"
    (sendMessage)="onSendMessage($event)">
  </app-ask-marketsense-modal>
</div>
