<div *ngIf="isVisible">
  <div class="modal-overlay" (click)="onClose()"></div>
  <div class="modal-container" (click)="onModalClick($event)">
    <!-- Current Profile Section (logged-in user) -->
    <div class="profile-section current-profile">
      <div class="profile-avatar">
        <span class="avatar-initials">{{ displayInitials }}</span>
      </div>
      <div class="profile-info">
        <div class="profile-name">{{ displayName }}</div>
        <div class="profile-role">{{ displayRole }}</div>
      </div>
    </div>

    <!-- Sign Out Section -->
    <div class="sign-out-section">
      <div class="sign-out-divider"></div>
      <button class="sign-out-button" (click)="onSignOut()">Sign Out</button>
    </div>
  </div>
</div>
