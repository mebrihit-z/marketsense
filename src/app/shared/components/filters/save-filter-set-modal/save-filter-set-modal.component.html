<div class="modal-overlay" (click)="onClose()" *ngIf="isVisible">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Header with Close Button -->
    <div class="modal-header">
      <div class="header-content">
        <div class="header-text">
          <h3 class="header-title">Save Filter Set</h3>
          <p class="header-description">Give this filter configuration a name for quick access</p>
        </div>
        <button class="close-btn" (click)="onClose()" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        class="input-field" 
        placeholder="e.g., High-confidence Equities"
        [(ngModel)]="filterSetName"
        (keydown.enter)="onKeyDown($event)"
        autofocus>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button 
        class="btn-save" 
        [class.disabled]="!filterSetName.trim()"
        [disabled]="!filterSetName.trim()"
        (click)="onSave()">
        Save
      </button>
    </div>
  </div>
</div>
