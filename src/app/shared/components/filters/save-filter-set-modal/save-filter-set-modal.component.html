<div class="modal-overlay" (click)="onClose()" *ngIf="isVisible">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Header with Close Button -->
    <div class="modal-header">
      <div class="header-content">
        <div class="header-text">
          <app-title title="Save View" subtitle="Give this filter configuration a name for quick access" level="h3"></app-title>
        </div>
        <button class="close-btn" (click)="onClose()" aria-label="Close">
          <img src="assets/icons/x-icon.svg" alt="Close" class="close-icon">
        </button>
      </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">
      <input 
        type="text" 
        class="input-field" 
        placeholder="e.g., High-confidence Equities"
        [(ngModel)]="filterSetName"
        (keydown.enter)="onKeyDown($event)"
        autofocus>
    </div>

    <!-- Default option (checkbox matches filter-dropdown) -->
    <label class="default-option" (click)="$event.stopPropagation()">
      <div class="checkbox-wrapper">
        <input type="checkbox" [(ngModel)]="isDefault" />
        <span class="checkmark"></span>
      </div>
      <span class="default-option-label">Set as default</span>
    </label>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button class="btn-cancel" (click)="onCancel()">Cancel</button>
      <button 
        class="btn-save" 
        [class.disabled]="!filterSetName.trim()"
        [disabled]="!filterSetName.trim()"
        (click)="onSave()">
        Save
      </button>
    </div>
  </div>
</div>
