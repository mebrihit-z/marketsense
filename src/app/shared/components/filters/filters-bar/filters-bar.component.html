<div class="filters-bar-root" #filtersRoot>



  <button
    *ngIf="stickyEngaged && stickyBarCollapsed"
    type="button"
    class="filters-bar-sticky-collapsed-btn"
    (click)="toggleStickyBarCollapse()"
    title="Show filters"
    aria-label="Show filters bar">
  
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
      <path d="M14 13L14 3C14 2.44772 13.5523 2 13 2L3 2C2.44771 2 2 2.44772 2 3L2 13C2 13.5523 2.44771 14 3 14L13 14C13.5523 14 14 13.5523 14 13Z" stroke="#C7EAFF" stroke-width="1.33" stroke-linejoin="round"/>
      <path d="M14 5.99994L2 5.99994M14 3.6666L14 11.9999M2 3.6666L2 11.9999M6.66667 9.33327L8 10.6666L9.33333 9.33327" stroke="#C7EAFF" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="view-filters-label">View filters</span>
  </button>



  <ng-container *ngIf="!stickyEngaged || !stickyBarCollapsed">

    <div class="filters-bar-container">

  <div class="filters-root">

    <div class="filters-and-toggles-content">

        <div class="filter-icon-container">

          <img src="assets/icons/filter-icon.svg" alt="Filter" class="filter-icon">

          <span class="filters-label">Filters:</span>

        </div>

        <div class="filters-and-toggles-content-inner">

          <div class="filters-container">

            <div class="filters-list">

              <app-filter-dropdown

                title="Investor Region"

                [options]="investorRegionOptions"

                [selected]="state.investorRegion"

                [headerSelectAllDisabled]="true"

                [isOpen]="isDropdownOpen('investorRegion')"

                [isTooltipOpenExternal]="closeAllFilterDropdownTooltips || (openFilterDropdownTooltip !== 'Investor Region' && openFilterDropdownTooltip !== null)"

                infoTooltip="Select the geographic source of capital flows (e.g., U.S., Europe) to understand where money is coming from."

                (selectedChange)="onChange('investorRegion', $event)"

                (openChange)="onDropdownOpenChange('investorRegion', $event)"

                (tooltipOpenChange)="onFilterDropdownTooltipChange($event.title, $event.isOpen)"

              ></app-filter-dropdown>



              <app-filter-dropdown

                title="Investor Type"

                [options]="investorTypeOptions"

                [selected]="state.investorType"

                [isOpen]="isDropdownOpen('investorType')"

                [isTooltipOpenExternal]="closeAllFilterDropdownTooltips || (openFilterDropdownTooltip !== 'Plan Type' && openFilterDropdownTooltip !== null)"

                infoTooltip="Filter by the type of investor (e.g., Institutional, Retail, Corporate) to analyze capital flows by investor category."

                (selectedChange)="onChange('investorType', $event)"

                (openChange)="onDropdownOpenChange('investorType', $event)"

                (tooltipOpenChange)="onFilterDropdownTooltipChange($event.title, $event.isOpen)"

              ></app-filter-dropdown>



              <app-filter-dropdown

                title="Product Region"

                [options]="productRegionOptions"

                [selected]="state.productRegion"

                [isOpen]="isDropdownOpen('productRegion')"

                [isTooltipOpenExternal]="closeAllFilterDropdownTooltips || (openFilterDropdownTooltip !== 'Product Region' && openFilterDropdownTooltip !== null)"

                infoTooltip="Choose the geographic destination of capital flows to see where investments are being directed."

                (selectedChange)="onChange('productRegion', $event)"

                (openChange)="onDropdownOpenChange('productRegion', $event)"

                (tooltipOpenChange)="onFilterDropdownTooltipChange($event.title, $event.isOpen)"

              ></app-filter-dropdown>



              <app-filter-dropdown

                title="Product Type"

                [options]="productTypeOptions"

                [selected]="state.productType"

                [isOpen]="isDropdownOpen('productType')"

                [isTooltipOpenExternal]="closeAllFilterDropdownTooltips || (openFilterDropdownTooltip !== 'Product Type' && openFilterDropdownTooltip !== null)"

                infoTooltip="Filter by asset class categories (e.g., Equity, Fixed Income, Alternatives) to analyze flows by investment type."

                (selectedChange)="onChange('productType', $event)"

                (openChange)="onDropdownOpenChange('productType', $event)"

                (tooltipOpenChange)="onFilterDropdownTooltipChange($event.title, $event.isOpen)"

              ></app-filter-dropdown>



              <app-filter-dropdown

                #productSubTypeDropdown

                title="Product Sub-Type"

                [groupedOptions]="productSubTypeOptions"

                [selected]="state.productSubType"

                [isOpen]="isDropdownOpen('productSubType')"

                [isTooltipOpenExternal]="closeAllFilterDropdownTooltips || (openFilterDropdownTooltip !== 'Product Sub-Type' && openFilterDropdownTooltip !== null)"

                infoTooltip="Select specific sub-categories within asset classes for detailed analysis of capital movements."

                (selectedChange)="onChange('productSubType', $event)"

                (openChange)="onDropdownOpenChange('productSubType', $event)"

                (tooltipOpenChange)="onFilterDropdownTooltipChange($event.title, $event.isOpen)"

              ></app-filter-dropdown>

            </div>

          </div>

          <!-- Toggles Section -->

          <div class="toggles-container">

            <!-- Time Horizon: own white card (app component) -->

            <app-time-horizon-slider
              [range]="timeHorizonRange"
              [infoTooltipOpen]="isTooltipOpen('timeHorizon')"
              [infoTooltipText]="getTooltipText('timeHorizon')"
              (rangeChange)="onTimeHorizonRangeFromSlider($event)"
              (timeHorizonChange)="onTimeHorizonEndFromSlider($event)"
              (timeHorizonRangeChange)="timeHorizonRangeChange.emit($event)"
              (inferredDataTypeChange)="onTimeHorizonInferredDataType($event)"
              (infoToggle)="onInfoClick('timeHorizon', $event)" />

            <!-- Min flow value: separate white card -->

            <div class="time-horizon-container min-flow-value-in-bar" *ngIf="minFlowValueOptions.length">

              <div class="label-with-info">
                <label class="toggle-label">Value Range:</label>
                <div class="info-btn-wrapper">
                  <button type="button" #minFlowValueInfoBtn class="info-btn" (click)="onInfoClick('minFlowValue', $event)" aria-label="Min flow value info">
                    <img src="assets/icons/info-icon.svg" alt="Info" class="info-icon">
                  </button>
                  <div
                    #minFlowValueTooltip
                    class="info-tooltip"
                    *ngIf="isTooltipOpen('minFlowValue')"
                    (click)="$event.stopPropagation()">
                    <div class="tooltip-content">
                      {{ getTooltipText('minFlowValue') }}
                    </div>
                    <div class="tooltip-arrow"></div>
                  </div>
                </div>
              </div>

              <div class="time-horizon-slider-wrapper time-horizon-slider-wrapper-full min-flow-slider-wrapper-filters">
                <app-min-flow-range-slider
                  class="min-flow-range-filters-embed"
                  [options]="minFlowValueOptions"
                  [(range)]="minFlowRange"
                  [showFlowSummary]="false"
                  (rangeChange)="emitMinFlowValueRange()" />
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

      <!-- Footer: minimize (sticky) left, actions right -->

      <div class="filters-bar-footer">
        

      <div class="filters-bar-footer-actions" [class.with-minimize]="stickyEngaged">
        <div class="filters-bar-footer-left" *ngIf="stickyEngaged">
          <button
            class="action-btn"
            (click)="toggleStickyBarCollapse()"
            title="Hide filters bar"
            aria-label="Hide filters bar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 3L2 13C2 13.5523 2.44772 14 3 14L13 14C13.5523 14 14 13.5523 14 13V3C14 2.44771 13.5523 2 13 2L3 2C2.44772 2 2 2.44771 2 3Z" stroke="#00113F" stroke-width="1.33" stroke-linejoin="round"/>
              <path d="M2 10.0001L14 10.0001M2 12.3334L2 4.00006M14 12.3334V4.00006M9.33333 6.66673L8 5.3334L6.66667 6.66673" stroke="#00113F" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span>Minimize Filters</span>
          </button>
        </div>
        <div class="pinned-selected-filters" *ngIf="hasPinnedSelectedFilters()">
          <button type="button" class="pinned-chip" (click)="openFromPinned('investorRegion')" aria-label="Open Investor Region filter">
            <span class="pinned-chip-title">Investor Region</span>
            <span class="pinned-chip-value">{{ getPinnedSummary('investorRegion') }}</span>
            <div class="pinned-chip-tooltip" role="tooltip">
              <div class="pinned-chip-tooltip-title">Investor Region</div>
              <ul class="pinned-chip-tooltip-list">
                <li *ngFor="let item of getPinnedHoverValues('investorRegion')">{{ item }}</li>
              </ul>
            </div>
          </button>

          <button type="button" class="pinned-chip" (click)="openFromPinned('investorType')" aria-label="Open Investor Type filter">
            <span class="pinned-chip-title">Investor Type</span>
            <span class="pinned-chip-value">{{ getPinnedSummary('investorType') }}</span>
            <div class="pinned-chip-tooltip" role="tooltip">
              <div class="pinned-chip-tooltip-title">Investor Type</div>
              <ul class="pinned-chip-tooltip-list">
                <li *ngFor="let item of getPinnedHoverValues('investorType')">{{ item }}</li>
              </ul>
            </div>
          </button>

          <button type="button" class="pinned-chip" (click)="openFromPinned('productRegion')" aria-label="Open Product Region filter">
            <span class="pinned-chip-title">Product Region</span>
            <span class="pinned-chip-value">{{ getPinnedSummary('productRegion') }}</span>
            <div class="pinned-chip-tooltip" role="tooltip">
              <div class="pinned-chip-tooltip-title">Product Region</div>
              <ul class="pinned-chip-tooltip-list">
                <li *ngFor="let item of getPinnedHoverValues('productRegion')">{{ item }}</li>
              </ul>
            </div>
          </button>

          <button type="button" class="pinned-chip" (click)="openFromPinned('productType')" aria-label="Open Product Type filter">
            <span class="pinned-chip-title">Product Type</span>
            <span class="pinned-chip-value">{{ getPinnedSummary('productType') }}</span>
            <div class="pinned-chip-tooltip" role="tooltip">
              <div class="pinned-chip-tooltip-title">Product Type</div>
              <ul class="pinned-chip-tooltip-list">
                <li *ngFor="let item of getPinnedHoverValues('productType')">{{ item }}</li>
              </ul>
            </div>
          </button>
        </div>

        <div class="action-buttons-container">

          <button class="action-btn clear-all-btn" *ngIf="!showSelectAll" (click)="clearAll()">

            <img src="assets/icons/refresh-icon.svg" alt="Refresh" class="action-icon">

            <span>Clear All Filters</span>

          </button>

          <button class="action-btn select-all-btn" *ngIf="showSelectAll" (click)="selectAll()">

            <img src="assets/icons/select-all-icon.svg" alt="Refresh" class="action-icon">

            <span>Select All Filters</span>

          </button>

          <button class="action-btn save-filter-btn" (click)="saveFilterSet()">

            <img src="assets/icons/bookmark-icon.svg" alt="Bookmark" class="action-icon">

            <span>Save View</span>

          </button>

        </div>
      </div>

      </div>

    </div>

  </ng-container>

</div>



<!-- Save Filter Set Modal -->

<app-save-filter-set-modal

  [isVisible]="isSaveFilterSetModalOpen"

  (close)="onCloseSaveFilterSetModal()"

  (save)="onSaveFilterSet($event)">

</app-save-filter-set-modal>
