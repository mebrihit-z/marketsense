<div class="modal-overlay" (click)="onClose()" *ngIf="isVisible">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <!-- Close Button -->
    <button class="close-btn" (click)="onClose()" aria-label="Close">
      <img src="assets/icons/x-icon.svg" alt="Close" class="close-icon">
    </button>

    <!-- Header -->
    <div class="modal-header">
      <app-title [title]="title" [subtitle]="subtitle" level="h2"></app-title>
    </div>

    <!-- Export Options -->
    <div class="export-options">
      <!-- PNG Option -->
      <button class="export-option" (click)="onExportPNG()">
        <div class="option-content">
          <div class="option-header">
            <div class="option-icon png-icon">
              <img src="assets/icons/download-icon.svg" alt="PNG" class="png-icon-img">
            </div>
            <span class="option-title">PNG</span>
          </div>
          <p class="option-description">Export expanded card as PNG image</p>
        </div>
      </button>

      <!-- PDF Option -->
      <button class="export-option" (click)="onExportPDF()">
        <div class="option-content">
          <div class="option-header">
            <div class="option-icon pdf-icon">
              <img src="assets/icons/pdf-icon.svg" alt="PDF" class="pdf-icon">
            </div>
            <span class="option-title">PDF</span>
          </div>
          <p class="option-description">Export formatted market flow card</p>
        </div>
      </button>
      <!-- CSV Option -->
      <button type="button" class="export-option" (click)="onExportCSV()">
        <div class="option-content">
          <div class="option-header">
            <div class="option-icon csv-icon">
              <img src="assets/icons/excel-icon.svg" alt="Excel" class="excel-icon">
            </div>
            <span class="option-title">CSV</span>
          </div>
          <p class="option-description">Download underlying data and metrics</p>
        </div>
      </button>
    </div>
  </div>
</div>
