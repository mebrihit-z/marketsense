<div class="featured-market-flows">
  <!-- Header Section -->
  <div class="header-container">
    <div class="title-section">
      <app-title [title]="headerTitle" level="h2"></app-title>
    </div>
    <div class="sort-section">
      <span class="sort-label">Sort by:</span>
      <div class="sort-dropdown">
        <button 
          type="button"
          class="sort-dropdown-button"
          (click)="toggleSortDropdown($event)"
          [attr.aria-expanded]="sortDropdownOpen"
          aria-haspopup="true">
          <span class="sort-dropdown-text">{{ selectedSortDisplayLabel }}</span>
          <svg 
            class="sort-dropdown-icon" 
            [class.open]="sortDropdownOpen"
            width="16" 
            height="16" 
            viewBox="0 0 16 16" 
            fill="none" 
            xmlns="http://www.w3.org/2000/svg">
            <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="sort-dropdown-menu" *ngIf="sortDropdownOpen" (click)="$event.stopPropagation()">
          <button
            *ngFor="let option of sortOptions"
            type="button"
            class="sort-option"
            [class.active]="selectedSortOption === option.value"
            (click)="selectSortOption(option.value, $event)">
            <img [src]="option.icon" [alt]="option.label" class="sort-option-icon">
            <span class="sort-option-label">{{ option.label }}</span>
            <span class="sort-option-dot" *ngIf="selectedSortOption === option.value"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Carousel Cards -->
  <div class="carousel-container">
    <div class="cards-grid">
      <app-market-flow-card
        *ngFor="let card of visibleCards"
        [card]="card"
        [isPinned]="isCardPinned(card.id)"
        (download)="onDownload($event)"
        (moreOptions)="onMoreOptions($event)"
        (askMarketSense)="onAskMarketSense($event)"
        (pin)="onPin($event)"
        (cardClick)="onCardClick($event)"
        (viewMore)="onCardClick($event)">
      </app-market-flow-card>
    </div>
  </div>

  <!-- Carousel Navigation -->
  <div class="navigation-container">
    <div class="pagination-info">
      <span class="page-info-text">Viewing {{ viewingRangeStart }}-{{ viewingRangeEnd }} of {{ totalCardsCount }} items</span>
    </div>
    <div class="pagination-controls">
      <button 
        class="page-btn prev" 
        [disabled]="currentSlideIndex === 0 || totalSlides === 0"
        (click)="previousSlide($event)"
        type="button"
        aria-label="Previous page">
        <img src="assets/icons/previous-icon.svg" alt="Previous page" class="page-btn-icon">
      </button>
      <div class="page-numbers">
        <button
          *ngFor="let page of visiblePageNumbers"
          type="button"
          class="page-number"
          [class.active]="page === currentPage"
          [class.ellipsis]="page === -1"
          [disabled]="page === -1"
          (click)="page !== -1 && goToSlide(page - 1)">
          <span *ngIf="page !== -1">{{ page }}</span>
          <span *ngIf="page === -1">...</span>
        </button>
      </div>
      <button 
        class="page-btn next" 
        [disabled]="currentSlideIndex >= totalSlides - 1 || totalSlides === 0"
        (click)="nextSlide($event)"
        type="button"
        aria-label="Next page">
        <img src="assets/icons/next-icon.svg" alt="Next page" class="page-btn-icon">
      </button>
    </div>
  </div>

  <!-- Ask MarketSense Modal -->
  <app-ask-marketsense-modal
    [isVisible]="showModal"
    [card]="selectedCard"
    (close)="onCloseModal()"
    (sendMessage)="onSendMessage($event)">
  </app-ask-marketsense-modal>

  <!-- Export Modal -->
  <app-export-modal
    [isVisible]="showExportModal"
    (close)="onCloseExportModal()"
    (exportXLS)="onExportXLS()"
    (exportPDF)="onExportPDF()">
  </app-export-modal>

  <!-- Market Flow Detail Modal -->
  <app-market-flow-detail-modal
    [isVisible]="showDetailModal"
    [card]="selectedCardForDetail"
    [rawAssetFlowsData]="rawAssetFlowsData"
    [timeHorizonRange]="timeHorizonRange"
    [selectedInvestorRegions]="selectedInvestorRegions"
    [selectedProductTypes]="selectedProductTypes"
    (close)="onCloseDetailModal()">
  </app-market-flow-detail-modal>
</div>
