<div class="featured-market-flows">
  <!-- Header Section -->
  <div class="header-container">
    <div class="title-section">
      <app-title [title]="headerTitle" level="h2"></app-title>
      <button
        type="button"
        class="market-flows-info-btn"
        data-market-flow-action
        aria-haspopup="dialog"
        aria-label="Market Flows: information and disclosures"
        (click)="openInformationDisclosureModal($event)">
        <img src="assets/icons/info-icon.svg" alt="" width="22" height="22" aria-hidden="true" class="market-flows-info-btn__icon" />
      </button>
    </div>
    <div class="sort-section">
      <span class="sort-label">Sort by:</span>
      <div class="sort-dropdown">
        <button 
          type="button"
          class="sort-dropdown-button"
          (click)="toggleSortDropdown($event)"
          [attr.aria-expanded]="sortDropdownOpen"
          aria-haspopup="true">
          <span class="sort-dropdown-text">{{ selectedSortDisplayLabel }}</span>
          <img src="assets/icons/caret-down-icon.svg" alt="Sort" class="sort-dropdown-icon">
        </button>
        <div class="sort-dropdown-menu" *ngIf="sortDropdownOpen" (click)="$event.stopPropagation()">
          <button
            *ngFor="let option of sortOptions"
            type="button"
            class="sort-option"
            [class.active]="selectedSortOption === option.value"
            (click)="selectSortOption(option.value, $event)">
            <img [src]="option.icon" [alt]="option.label" class="sort-option-icon">
            <span class="sort-option-label">{{ option.label }}</span>
            <span class="sort-option-dot" *ngIf="selectedSortOption === option.value"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Carousel: grid when no selection, two-column (detail left + stacked cards right) when a card is selected -->
  <div class="carousel-container" *ngIf="!selectedCardForDetail">
    <div
      class="cards-grid"
      [style.grid-template-columns]="'repeat(' + cardsPerSlide + ', minmax(0, 1fr))'">
      <app-market-flow-card
        *ngFor="let card of visibleCards"
        [card]="card"
        [isPinned]="isCardPinned(card.id)"
        (moreOptions)="onMoreOptions($event)"
        (askMarketSense)="onAskMarketSense($event)"
        (pin)="onPin($event)"
        (cardClick)="onCardClick($event)"
        (viewMore)="onCardClick($event)">
      </app-market-flow-card>
    </div>
  </div>

  <!-- Two-column layout: selected detail on left, stacked cards on right -->
  <div class="detail-and-cards-layout" *ngIf="selectedCardForDetail">
    <div class="detail-column">
      <app-market-flow-detail-modal
        [inline]="true"
        [isVisible]="true"
        [card]="selectedCardForDetail"
        [rawAssetFlowsData]="rawAssetFlowsData"
        [timeHorizonRange]="timeHorizonRange"
        [selectedInvestorRegions]="selectedInvestorRegions"
        [selectedInvestorTypes]="selectedInvestorTypes"
        [selectedProductRegions]="selectedProductRegions"
        [selectedProductTypes]="selectedProductTypes"
        (close)="onCloseDetailModal()"
        (openExport)="onDownload()"
        (askMarketSense)="onAskMarketSense($event)">
      </app-market-flow-detail-modal>
    </div>
    <div class="stacked-cards-column">
      <app-market-flow-card
        *ngFor="let card of stackedCards | slice:0:stackedCardsCount"
        class="stacked-rail"
        [card]="card"
        [isPinned]="isCardPinned(card.id)"
        (moreOptions)="onMoreOptions($event)"
        (askMarketSense)="onAskMarketSense($event)"
        (pin)="onPin($event)"
        (cardClick)="onCardClick($event)"
        (viewMore)="onCardClick($event)">
      </app-market-flow-card>
    </div>
    <!-- Pagination: below detail on desktop, below cards on iPad -->
    <div class="detail-layout-navigation">
      <div class="pagination-info">
        <span class="page-info-text">Viewing {{ viewingRangeStart }}{{ viewingRangeStart !== viewingRangeEnd ? '-' + viewingRangeEnd : '' }} of {{ totalCardsCount }} items</span>
      </div>
      <div class="pagination-controls">
        <button
          class="page-btn prev"
          [disabled]="currentSlideIndex === 0 || totalSlides === 0"
          (click)="previousSlide($event)"
          type="button"
          aria-label="Previous page">
          <img src="assets/icons/previous-icon.svg" alt="Previous page" class="page-btn-icon">
        </button>
        <div class="page-numbers">
          <button
            *ngFor="let page of visiblePageNumbers"
            type="button"
            class="page-number"
            [class.active]="page === currentPage"
            [class.ellipsis]="page === -1"
            [disabled]="page === -1"
            (click)="page !== -1 && goToSlide(page - 1)">
            <span *ngIf="page !== -1">{{ page }}</span>
            <span *ngIf="page === -1">...</span>
          </button>
        </div>
        <button
          class="page-btn next"
          [disabled]="currentSlideIndex >= totalSlides - 1 || totalSlides === 0"
          (click)="nextSlide($event)"
          type="button"
          aria-label="Next page">
          <img src="assets/icons/next-icon.svg" alt="Next page" class="page-btn-icon">
        </button>
      </div>
    </div>
  </div>

  <!-- Carousel Navigation (when no card selected) -->
  <div class="navigation-container" *ngIf="!selectedCardForDetail">
    <div class="pagination-info">
      <span class="page-info-text">Viewing {{ viewingRangeStart }}{{ viewingRangeStart !== viewingRangeEnd ? '-' + viewingRangeEnd : '' }} of {{ totalCardsCount }} items</span>
    </div>
    <div class="pagination-controls">
      <button 
        class="page-btn prev" 
        [disabled]="currentSlideIndex === 0 || totalSlides === 0"
        (click)="previousSlide($event)"
        type="button"
        aria-label="Previous page">
        <img src="assets/icons/previous-icon.svg" alt="Previous page" class="page-btn-icon">
      </button>
      <div class="page-numbers">
        <button
          *ngFor="let page of visiblePageNumbers"
          type="button"
          class="page-number"
          [class.active]="page === currentPage"
          [class.ellipsis]="page === -1"
          [disabled]="page === -1"
          (click)="page !== -1 && goToSlide(page - 1)">
          <span *ngIf="page !== -1">{{ page }}</span>
          <span *ngIf="page === -1">...</span>
        </button>
      </div>
      <button 
        class="page-btn next" 
        [disabled]="currentSlideIndex >= totalSlides - 1 || totalSlides === 0"
        (click)="nextSlide($event)"
        type="button"
        aria-label="Next page">
        <img src="assets/icons/next-icon.svg" alt="Next page" class="page-btn-icon">
      </button>
    </div>
  </div>

  <!-- Ask MarketSense Modal -->
  <app-ask-marketsense-modal
    [isVisible]="showModal"
    [card]="selectedCard"
    (close)="onCloseModal()"
    (sendMessage)="onSendMessage($event)">
  </app-ask-marketsense-modal>

  <!-- Export Modal -->
  <app-export-modal
    [isVisible]="showExportModal"
    (close)="onCloseExportModal()"
    (exportXLS)="onExportXLS()"
    (exportCSV)="onExportCSV()"
    (exportPNG)="onExportPNG()"
    (exportPDF)="onExportPDF()">
  </app-export-modal>

  <app-information-and-disclosure
    [isVisible]="isInformationDisclosureModalOpen"
    [footerData]="informationDisclosureFooterData"
    (close)="closeInformationDisclosureModal()">
  </app-information-and-disclosure>

</div>
