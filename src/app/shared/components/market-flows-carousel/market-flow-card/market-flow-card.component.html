<div class="card"
     role="button"
     tabindex="0"
     (click)="onCardClick($event)"
     (mousedown)="onCardMouseDown($event)"
     (pointerdown)="onCardPointerDown($event)"
     (touchstart)="onCardTouchStart($event)"
     (keydown)="onCardKeyDown($event)"
     [attr.aria-label]="'View details for ' + card.title">
  <!-- Card Header: Title (left) + actions (right) -->
  <div class="card-header">
    <app-title [title]="card.title" level="h4" class="card-title"></app-title>
    <div class="card-actions" data-market-flow-action="actions" (click)="$event.stopPropagation()" (touchstart)="$event.stopPropagation()" (pointerdown)="$event.stopPropagation()" (mousedown)="$event.stopPropagation()">
      <button
        type="button"
        class="icon-btn icon-btn--ask-ai"
        data-market-flow-action="ask-marketsense"
        (click)="onAskMarketSense($event)"
        (pointerdown)="onAskMarketSense($event)"
        (touchstart)="onAskMarketSense($event)"
        (mousedown)="onAskMarketSense($event)"
        aria-label="Ask MarketSense AI">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" class="card-ask-ai-svg" aria-hidden="true">
          <path
            class="card-ask-ai-sparkle-main"
            d="M11.0174 2.81395C11.0603 2.58456 11.182 2.37737 11.3615 2.22827C11.5411 2.07917 11.7671 1.99756 12.0004 1.99756C12.2338 1.99756 12.4598 2.07917 12.6393 2.22827C12.8189 2.37737 12.9406 2.58456 12.9834 2.81395L14.0344 8.37195C14.1091 8.7671 14.3011 9.13057 14.5855 9.41492C14.8698 9.69928 15.2333 9.89131 15.6284 9.96595L21.1864 11.017C21.4158 11.0598 21.623 11.1815 21.7721 11.3611C21.9212 11.5406 22.0028 11.7666 22.0028 12C22.0028 12.2333 21.9212 12.4593 21.7721 12.6389C21.623 12.8184 21.4158 12.9401 21.1864 12.983L15.6284 14.034C15.2333 14.1086 14.8698 14.3006 14.5855 14.585C14.3011 14.8693 14.1091 15.2328 14.0344 15.628L12.9834 21.186C12.9406 21.4153 12.8189 21.6225 12.6393 21.7716C12.4598 21.9207 12.2338 22.0023 12.0004 22.0023C11.7671 22.0023 11.5411 21.9207 11.3615 21.7716C11.182 21.6225 11.0603 21.4153 11.0174 21.186L9.96644 15.628C9.8918 15.2328 9.69977 14.8693 9.41541 14.585C9.13106 14.3006 8.76759 14.1086 8.37244 14.034L2.81444 12.983C2.58504 12.9401 2.37786 12.8184 2.22876 12.6389C2.07966 12.4593 1.99805 12.2333 1.99805 12C1.99805 11.7666 2.07966 11.5406 2.22876 11.3611C2.37786 11.1815 2.58504 11.0598 2.81444 11.017L8.37244 9.96595C8.76759 9.89131 9.13106 9.69928 9.41541 9.41492C9.69977 9.13057 9.8918 8.7671 9.96644 8.37195L11.0174 2.81395Z"/>
          <path class="card-ask-ai-sparkle-plus" d="M20 2V6"/>
          <path class="card-ask-ai-sparkle-plus" d="M22 4H18"/>
          <path class="card-ask-ai-sparkle-dot" d="M4 22C5.10457 22 6 21.1046 6 20C6 18.8954 5.10457 18 4 18C2.89543 18 2 18.8954 2 20C2 21.1046 2.89543 22 4 22Z"/>
        </svg>
      </button>
      <button
        type="button"
        class="icon-btn"
        data-market-flow-action="pin"
        [class.pinned]="isPinned"
        (click)="onPin($event)"
        (pointerdown)="onPin($event)"
        (touchstart)="onPin($event)"
        (mousedown)="onPin($event)"
        aria-label="Pin Button">
        <img
          [src]="isPinned ? 'assets/icons/pined-pin-icon.svg' : 'assets/icons/pin-icon.svg'"
          alt="Pin Button">
      </button>
    </div>
  </div>
  <!-- Value row: main value (left) | percentage pill + AUM (right), same row -->
  <div class="value-row">
    <div
      class="large-value flow-value-hover"
      [class.negative]="card.valueColor === 'red'"
      [class.positive]="card.valueColor === 'green'"
      [attr.data-flow-tooltip]="valueHoverFullLabel">
      <span class="net-flow-trend-icon" aria-hidden="true">
        @if (card.valueColor === 'green') {
          <img
            src="assets/icons/up-curved-arrow-icon.svg"
            alt=""
            class="net-flow-trend-svg"
            width="26"
            height="26">
        } @else {
          <img
            src="assets/icons/down-curved-arrow-icon.svg"
            alt=""
            class="net-flow-trend-svg"
            width="26"
            height="26">
        }
      </span>
      <span class="large-value-text">{{ card.value }}</span>
    </div>
    <div class="badge-container">
      <span
        class="percentage-pill flow-value-hover"
        [class.negative]="card.percentageColor === 'red'"
        [class.positive]="card.percentageColor === 'green'"
        [class.neutral]="card.percentageColor === 'neutral'"
        [attr.data-flow-tooltip]="percentageHoverLabel">
        {{ card.percentageChange }}
      </span>
    </div>
  </div>

  <!-- View More > (bottom right) -->
  <div class="view-more-row">
    <div class="sample-size-container">
      <span
        class="sample-size-hint flow-value-hover"
        [attr.data-flow-tooltip]="sampleSizeHoverLabel">
        <span class="sample-size-label">
          Sample Size: {{ sampleSizeDisplay }}
        </span>
      </span>
    </div>
    <a
      href="#"
      class="view-more-link"
      data-market-flow-action="view-more"
      (click)="onViewMore($event)"
      (pointerdown)="onViewMore($event)"
      (touchstart)="onViewMore($event)"
      (mousedown)="onViewMore($event)"
      aria-label="View more">
      View More <span class="view-more-arrow" aria-hidden="true">&gt;</span>
    </a>
  </div>
</div>
