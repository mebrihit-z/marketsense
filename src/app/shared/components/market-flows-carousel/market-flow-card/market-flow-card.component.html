<div class="card" (click)="onCardClick($event)" (mousedown)="onCardMouseDown($event)" (touchstart)="onCardTouchStart($event)">
  <!-- Card Header -->
  <div class="card-header">
    <app-title [title]="card.title" level="h4" class="card-title"></app-title>
    <div class="card-actions" (click)="$event.stopPropagation()" (touchstart)="$event.stopPropagation()">
      <!-- Pin Button -->
      <button
        type="button"
        class="icon-btn"
        [class.pinned]="isPinned"
        (click)="onPin($event)"
        (touchstart)="onPin($event)"
        (mousedown)="onPin($event)"
        aria-label="Pin Button">
        <img
          [src]="isPinned ? 'assets/icons/pined-pin-icon.svg' : 'assets/icons/pin-icon.svg'"
          alt="Pin Button">
      </button>
      <!-- Download Button -->
      <button type="button" class="icon-btn" (click)="onDownload($event)" (touchstart)="onDownload($event)" (mousedown)="onDownload($event)" aria-label="Download">
        <img src="assets/icons/download-icon.svg" alt="download icon" class="more-options-icon">
      </button>
    </div>
  </div>

  <!-- Content Section -->
  <div class="content-section">
    <!-- Badge, Label and Score row -->
    <div class="metrics-row">
      <div class="badge-container">
        <div class="badge" [class.negative]="card.percentageColor === 'red'" [class.positive]="card.percentageColor === 'green'">
          {{ card.percentageChange }}
        </div>
        <span class="metric-label">{{ card.metricLabel }}</span>
      </div>
      <!-- Score Indicator -->
      <!-- <div class="score-indicator">
        <span class="score-dot" [style.background-color]="getConfidenceColor(card.aiConfidence)"></span>
        <span class="score-text">Score</span>
      </div> -->
    </div>

    <!-- Large Value and View More row -->
    <div class="bottom-row">
      <div class="large-value" [class.negative]="card.valueColor === 'red'" [class.positive]="card.valueColor === 'green'">
        {{ card.value }}
      </div>
      <a
        href="#"
        class="view-more-link"
        (click)="onViewMore($event)"
        (touchstart)="onViewMore($event)"
        (mousedown)="onViewMore($event)"
        aria-label="View more">
        View More
        <img src="assets/icons/view-more-icon.svg" alt="" class="view-more-chevron">
      </a>
    </div>
  </div>
</div>
