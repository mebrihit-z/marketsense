<div class="card" (click)="onCardClick()">
  <!-- Card Header -->
  <div class="card-header">
    <h3 class="card-title">{{ card.title }}</h3>
    <div class="card-actions">
      <!-- Pin Button -->
      <button type="button" class="icon-btn" [class.pinned]="isPinned" (click)="onPin($event); $event.stopPropagation()" (mousedown)="onPin($event)" (touchstart)="onPin($event)" aria-label="Pin Button">
        <img src="assets/icons/pin-icon.svg" alt="Pin Button">
      </button>
      <!-- Download Button -->
      <button type="button" class="icon-btn" (click)="onDownload($event); $event.stopPropagation()" aria-label="Download">
        <img src="assets/icons/download-icon.svg" alt="download icon" class="more-options-icon">
      </button>
    </div>
  </div>

  <!-- Content Section -->
  <div class="content-section">
    <!-- Badge and Label -->
    <div class="badge-container">
      <div class="badge" [class.negative]="card.percentageColor === 'red'" [class.positive]="card.percentageColor === 'green'">
        {{ card.percentageChange }}
      </div>
      <span class="metric-label">{{ card.metricLabel }}</span>
    </div>

    <!-- Large Value -->
    <div class="large-value" [class.negative]="card.valueColor === 'red'" [class.positive]="card.valueColor === 'green'">
      {{ card.value }}
    </div>
  </div>

  <!-- Score Indicator -->
  <div class="score-indicator">
    <span class="score-dot" [style.background-color]="getConfidenceColor(card.aiConfidence)"></span>
    <span class="score-text">Score</span>
  </div>
</div>
