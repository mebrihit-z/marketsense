<div class="header">
  <div class="header-container">
    <!-- Row 1: Logo and profile -->
    <div class="header-row header-row-1">
      <a routerLink="/" class="brand-link">
        <img src="assets/images/marsh-logo.svg" alt="MarketSense Logo" class="brand-logo brand-logo-default">
        <img src="assets/icons/marsh-logo-white.svg" alt="MarketSense Logo" class="brand-logo brand-logo-white">
      </a>
      <div class="settings-and-user">
        <span class="user-name" (click)="toggleProfileModal()">{{ displayInitials }}</span>
        <app-profile-modal
          [isVisible]="isProfileModalOpen"
          (close)="closeProfileModal()">
        </app-profile-modal>
      </div>
    </div>
    <!-- Row 2: Brand description and last login -->
    <div class="header-row header-row-2">
      <div class="brand-description">Personalized market signals and asset flow intelligence</div>
    </div>
  </div>
</div>
