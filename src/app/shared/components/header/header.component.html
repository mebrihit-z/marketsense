<div class="header">
  <div class="header-container">
    <!-- Row 1: Logo and profile -->
    <div class="header-row header-row-1">
      <a routerLink="/" class="brand-link">
        <img src="assets/images/marsh-logo.svg" alt="MarketSense Logo" class="brand-logo brand-logo-default">
        <img src="assets/icons/marsh-logo-white.svg" alt="MarketSense Logo" class="brand-logo brand-logo-white">
      </a>
      <div class="settings-and-user">
        <span class="user-name" (click)="toggleProfileModal()">{{ displayInitials }}</span>
        <app-profile-modal
          [isVisible]="isProfileModalOpen"
          (close)="closeProfileModal()">
        </app-profile-modal>
      </div>
    </div>
    <!-- Row 2: Brand description and last login -->
    <div class="header-row header-row-2">
      <div class="brand-description">Personalized market signals and asset flow intelligence</div>
      <div class="brand-description last-updated">
        
        <div class="last-updated__content">
          <span class="last-updated__label">
            <svg
              class="last-updated__icon"
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              aria-hidden="true">
              <path d="M4.66699 1.16669V3.50002" stroke="currentColor" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.33301 1.16669V3.50002" stroke="currentColor" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11.0833 2.33331H2.91667C2.27233 2.33331 1.75 2.85565 1.75 3.49998V11.6666C1.75 12.311 2.27233 12.8333 2.91667 12.8333H11.0833C11.7277 12.8333 12.25 12.311 12.25 11.6666V3.49998C12.25 2.85565 11.7277 2.33331 11.0833 2.33331Z" stroke="currentColor" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M1.75 5.83331H12.25" stroke="currentColor" stroke-width="1.16667" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Last updated</span>
          <span class="last-updated__date-row">
            <span class="last-updated__date">{{ lastUpdatedLabel }}</span>
            <ng-container *ngIf="modelVersionLabel">
              <span class="last-updated__sep" aria-hidden="true">&nbsp; • &nbsp;</span>
              <span class="last-updated__version">{{ modelVersionLabel }}</span>
            </ng-container>
          </span>
        </div>
      </div>
    </div>
  </div>

  <app-disclaimer-banner
    [isVisible]="showTopDisclaimerBanner"
    position="top"
    (learnMore)="openDisclosureModal()"
    (close)="closeDisclaimerBanner()">
  </app-disclaimer-banner>
</div>
