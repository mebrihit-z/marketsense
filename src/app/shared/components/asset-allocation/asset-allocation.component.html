<div class="asset-allocation-container">
  <div class="top-section"> 
     <!-- Header Section -->
    <div class="header-section">
      <!-- Left: Title and Button -->
      <div class="title-container">
        <div class="title-row">
          <div class="title-container-inner">
            <div class="title-container-inner-left">
              <h2>Cash Flow by Asset Allocation</h2>
              <button
                type="button"
                class="asset-allocation-info-btn"
                aria-haspopup="dialog"
                aria-label="Cash Flow by Asset Allocation: information and disclosures"
                (click)="openInformationDisclosureModal($event)">
                <img src="assets/icons/info-icon.svg" alt="" width="22" height="22" aria-hidden="true" class="asset-allocation-info-btn__icon" />
              </button>
            </div>
            <p class="title-container-inner-left-subtitle">Three-level drill-down view across selected categories</p>
          </div>
        </div>
      </div>

      <!-- Right: Controls -->
      <div class="controls-section">
        <!-- Pin Button -->
        <button class="more-options-btn" [class.pinned]="isPinned" aria-label="Pin Button" (click)="onPinClick()">
          <img [src]="isPinned ? 'assets/icons/pined-pin-icon.svg' : 'assets/icons/pin-icon.svg'" alt="Pin Button" class="pinned-icon"/>
        </button>
        <!-- Download Button -->
        <button class="more-options-btn" aria-label="Export Treemap chart" (click)="onOpenExportModal()">
          <img src="assets/icons/download-icon.svg" alt="More options" class="download-icon"/>
        </button>
      </div>
    </div>
    <!-- Flow Dimensions -->
    <div class="dimensions-section">
      <div class="dimensions-section-inner">
        <app-flow-dimensions
          title="Flow Dimensions"
          subtitle="Select three dimensions to drill down through the treemap. Dimension 1 shows the top-level grouping, Dimension 2 breaks it down further, and Dimension 3 reveals the deepest level."
          [availableDimensions]="availableDimensions"
          [selectedDimension1]="selectedDimension1"
          [selectedDimension2]="selectedDimension2"
          [selectedDimension3]="selectedDimension3"
          [forceCloseDimensionDropdown]="forceCloseDimensionDropdown"
          [showNoneForDimension3]="true"
          (dimensionChange)="onFlowDimensionChange($event)"
          (dimensionDropdownOpened)="dimensionDropdownOpened.emit()">
        </app-flow-dimensions>
      </div>
    </div>
  </div>
  <!-- Treemap Visualization -->
  <div class="visualization-container" #chartExportRoot>
    <div *ngFor="let regionData of regionDataArray; let isLast = last; trackBy: trackByRegionKey" class="treemap-region-container">
      <div class="reallocation-treemap-section">
        <app-treemap
          *ngIf="isTreemapRowVisible(regionData)"
          [data]="regionData.data"
          [sankeyHasLeafDimension]="(selectedDimension3?.id ?? 'none') !== 'none'"
          [useSuperListFilter]="isDimension1InvestorRegion()"
          [selectedInvestorRegions]="regionData.investorRegions"
          [selectedProductTypes]="cachedSelectedProductTypes"
          [selectedProductSubTypes]="cachedSelectedProductSubTypes"
          [minFlowValue]="minFlowValue"
          [maxFlowValue]="maxFlowValue"
          [timeHorizon]="timeHorizon"
          [timeHorizonStart]="timeHorizonStart"
          [timeHorizonEnd]="timeHorizonEnd">
        </app-treemap>
      </div>
    </div>
  </div>
</div>

<!-- Treemap Cell Modal -->
<app-treemap-cell-modal
  [isVisible]="showCellModal"
  [cellData]="selectedCellData"
  (close)="onCloseModal()"
  (askAI)="onAskAI()">
</app-treemap-cell-modal>

<app-information-and-disclosure
  [variant]="'asset-allocation'"
  [isVisible]="isInformationDisclosureOpen"
  [footerData]="informationDisclosureFooterData"
  (close)="closeInformationDisclosureModal()">
</app-information-and-disclosure>

<app-charts-export-modal
  [isVisible]="showExportModal"
  [title]="'Export Asset Allocation'"
  [subtitle]="'PNG, PDF, or CSV of the treemap'"
  [showCsvExport]="true"
  (close)="onCloseExportModal()"
  (exportPNG)="onExportPNG()"
  (exportPDF)="onExportPDF()"
  (exportCSV)="onExportCSV()">
</app-charts-export-modal>
